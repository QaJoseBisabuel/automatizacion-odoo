trigger:
  branches:
    include: [main, develop]

pr:
  branches:
    include: [main, develop]

pool:
  vmImage: ubuntu-latest

variables:
  # Cree el grupo en Pipelines > Library con ODOO_URL, ODOO_USER y ODOO_PASS (los dos últimos como secretos)
  - group: odoo-automation-secrets

steps:
  - task: NodeTool@0
    inputs:
      versionSpec: '22.x'

  - script: npm ci
    displayName: Instalar dependencias

  - script: npx playwright install --with-deps chromium
    displayName: Instalar navegador

  # En cada push/PR: solo smoke (rápido)
  - script: npm run test:smoke
    displayName: Smoke tests
    env:
      CI: 'true'
      ODOO_URL: $(ODOO_URL)
      ODOO_USER: $(ODOO_USER)
      ODOO_PASS: $(ODOO_PASS)

  - task: PublishTestResults@2
    condition: always()
    inputs:
      testResultsFormat: JUnit
      testResultsFiles: test-results/junit.xml
      testRunTitle: Playwright smoke

  - task: PublishPipelineArtifact@1
    condition: always()
    inputs:
      targetPath: playwright-report
      artifact: playwright-report
